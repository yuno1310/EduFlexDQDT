# Load local env file in backend/ (key=value format)
spring.config.import=optional:file:.env[.properties]

# ── Server ──
server.port=8080

# ── Supabase (from .env) ──
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.key=${SUPABASE_PUBLISHABLE_KEY:}

# JWT Configration
JwtSecret=${JWT_SECRETKEY}
JwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# ── PostgreSQL ──
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ── H2 Console (http://localhost:8080/h2-console) ──
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── Flyway (Database Migrations) ──
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true

# DevTools and Logging
spring.devtools.restart.enabled=${DEVTOOLS_RESTART_ENABLED:false}
logging.level.org.jooq.tools.LoggerListener=${JOOQ_LOG_LEVEL:WARN}
logging.level.org.jooq=${JOOQ_LOG_LEVEL:WARN}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:100MB}

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# AI runs only on the backend. Never place provider keys in the Android build.
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
