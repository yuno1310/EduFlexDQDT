global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [eduflex-alertmanager:9093]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [eduflex-prometheus:9090]

  - job_name: eduflex-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [eduflex-api:8081]

  - job_name: eduflex-api-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://eduflex-api:8080/readyz]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: eduflex-blackbox:9115

  - job_name: postgres
    static_configs:
      - targets: [eduflex-postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [eduflex-redis-exporter:9121]

  - job_name: rabbitmq
    static_configs:
      - targets: [eduflex-rabbitmq:15692]

  - job_name: rabbitmq-queues
    metrics_path: /metrics/per-object
    static_configs:
      - targets: [eduflex-rabbitmq:15692]
